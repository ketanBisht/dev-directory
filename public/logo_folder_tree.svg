<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tree-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>

    <linearGradient id="folder-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="node-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="node-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="node-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="tree-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" rx="120" fill="url(#tree-bg)"/>

  <!-- Root Directory Line (Left Vertical Spine) -->
  <path d="M140 145 V370" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Branch 1 Line -->
  <path d="M140 220 H200" stroke="#4f46e5" stroke-width="8" stroke-linecap="round"/>
  <!-- Sub-branch from Branch 1 -->
  <path d="M210 220 V300 H260" stroke="#334155" stroke-width="8" stroke-linecap="round"/>

  <!-- Branch 2 Line -->
  <path d="M140 370 H260" stroke="#c084fc" stroke-width="8" stroke-linecap="round"/>

  <!-- ROOT FOLDER NODE (Top Root: /dev) -->
  <g transform="translate(110, 95)" filter="url(#tree-glow)">
    <rect width="180" height="70" rx="16" fill="url(#folder-top)"/>
    <!-- Folder tab accent -->
    <path d="M12 0 H65 L80 18 H12 Z" fill="#a5b4fc"/>
    <!-- Root Label / Icon -->
    <text x="35" y="44" fill="#ffffff" font-family="monospace" font-weight="800" font-size="28">/dev</text>
    <circle cx="145" cy="35" r="8" fill="#38bdf8"/>
  </g>

  <!-- SUB-FOLDER NODE 1: /tools (Cyan) -->
  <g transform="translate(205, 185)" filter="url(#tree-glow)">
    <rect width="170" height="60" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
    <path d="M20 20 H40 M20 30 H55 M20 40 H48" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <text x="70" y="39" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="20">tools</text>
  </g>

  <!-- FILE NODE 1: react.ts (Sub of tools) -->
  <g transform="translate(265, 270)">
    <rect width="150" height="50" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <circle cx="28" cy="25" r="7" fill="url(#node-cyan)"/>
    <text x="46" y="32" fill="#94a3b8" font-family="monospace" font-weight="600" font-size="17">react.ts</text>
  </g>

  <!-- SUB-FOLDER NODE 2: /apis (Purple) -->
  <g transform="translate(265, 340)" filter="url(#tree-glow)">
    <rect width="160" height="60" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="4"/>
    <path d="M20 20 H40 M20 30 H55 M20 40 H48" stroke="#c084fc" stroke-width="4" stroke-linecap="round"/>
    <text x="70" y="39" fill="#f8fafc" font-family="sans-serif" font-weight="700" font-size="20">apis</text>
  </g>

  <!-- Glowing Branch Joint Nodes -->
  <circle cx="140" cy="220" r="10" fill="#818cf8" filter="url(#tree-glow)"/>
  <circle cx="140" cy="370" r="10" fill="#c084fc" filter="url(#tree-glow)"/>
  <circle cx="210" cy="220" r="8" fill="#38bdf8"/>
</svg>
