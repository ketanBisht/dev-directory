<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="c3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <linearGradient id="c3-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="c3-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#c3-bg)"/>

  <!-- Outer Directory Ring (Search & Discovery Aperture) -->
  <circle cx="256" cy="256" r="170" stroke="url(#c3-ring)" stroke-width="24" stroke-linecap="round" stroke-dasharray="700 80" filter="url(#c3-glow)"/>

  <!-- Inner Tilde & Slash: Terminal Directory Symbol ~/ -->
  <!-- Tilde ~ -->
  <path d="M160 256 C175 236, 195 236, 210 256 C225 276, 245 276, 260 256" 
        stroke="#ffffff" stroke-width="28" stroke-linecap="round" fill="none" filter="url(#c3-glow)"/>

  <!-- Forward Slash / -->
  <line x1="285" y1="315" x2="345" y2="195" 
        stroke="url(#c3-ring)" stroke-width="28" stroke-linecap="round" filter="url(#c3-glow)"/>

  <!-- Floating Directory Node Dots -->
  <circle cx="360" cy="330" r="14" fill="#38bdf8"/>
  <circle cx="150" cy="170" r="10" fill="#a855f7"/>
</svg>
