<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <filter id="glow-effect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Card Base -->
  <rect width="512" height="512" rx="120" fill="url(#bg-grad)"/>

  <!-- Tree Connector Line -->
  <path d="M160 170 V340 H250" stroke="url(#primary-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-effect)"/>
  <path d="M160 255 H250" stroke="url(#accent-grad)" stroke-width="16" stroke-linecap="round" filter="url(#glow-effect)"/>

  <!-- Main Parent Folder (Top) -->
  <g transform="translate(130, 110)" filter="url(#glow-effect)">
    <path d="M0 20 C0 8.954 8.954 0 20 0 H80 L100 20 H200 C211.046 20 220 28.954 220 40 V100 C220 111.046 211.046 120 200 120 H20 C8.954 120 0 111.046 0 100 V20 Z" fill="url(#primary-grad)"/>
    <text x="35" y="72" fill="#ffffff" font-family="monospace" font-weight="800" font-size="34">~/dev</text>
  </g>

  <!-- Sub Folder 1 (Middle) -->
  <g transform="translate(240, 205)" filter="url(#glow-effect)">
    <path d="M0 16 C0 7.163 7.163 0 16 0 H65 L80 16 H160 C168.837 16 176 23.163 176 32 V80 C176 88.837 168.837 96 160 96 H16 C7.163 96 0 88.837 0 80 V16 Z" fill="url(#accent-grad)"/>
    <text x="25" y="58" fill="#ffffff" font-family="monospace" font-weight="700" font-size="24">/tools</text>
  </g>

  <!-- Sub Folder 2 (Bottom) -->
  <g transform="translate(240, 295)" filter="url(#glow-effect)">
    <path d="M0 16 C0 7.163 7.163 0 16 0 H65 L80 16 H160 C168.837 16 176 23.163 176 32 V80 C176 88.837 168.837 96 160 96 H16 C7.163 96 0 88.837 0 80 V16 Z" fill="#1e293b" stroke="url(#primary-grad)" stroke-width="6"/>
    <text x="25" y="58" fill="#a855f7" font-family="monospace" font-weight="700" font-size="24">/libs</text>
  </g>

  <!-- Tree Joint Dots -->
  <circle cx="160" cy="170" r="14" fill="#6366f1" filter="url(#glow-effect)"/>
  <circle cx="160" cy="255" r="14" fill="#38bdf8" filter="url(#glow-effect)"/>
  <circle cx="160" cy="340" r="14" fill="#a855f7" filter="url(#glow-effect)"/>
</svg>
